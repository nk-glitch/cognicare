name: cognicare
description: A dementia support Flutter application
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase - Updated versions
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1

  # Local notifications - Updated version
  flutter_local_notifications: ^20.0.0

  # Location - Updated versions
  geolocator: ^14.0.2
  google_maps_flutter: ^2.10.0

  # State management & storage
  provider: ^6.1.1
  shared_preferences: ^2.3.5

  # UI - Updated versions
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # URL Launcher - ADD THIS LINE
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true